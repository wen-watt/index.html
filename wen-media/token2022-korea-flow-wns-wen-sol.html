<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Path: Token-2022 to STO Law</title>
    <style>
        /* Общие настройки страницы и сброс стилей */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #03030c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        /* Интерактивный космический задний план */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #0c0926 0%, #03030c 80%);
        }

        /* Медленно плывущая космическая пыль/туманность */
        .nebula {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 40%, rgba(24, 95, 165, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(15, 110, 86, 0.12) 0%, transparent 40%);
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Контейнер для центрирования схемы */
        .content-container {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Оболочка SVG-диаграммы */
        .t22-flow {
            width: 100%;
            max-width: 760px;
            background: rgba(10, 10, 25, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(24, 95, 165, 0.15);
        }

        /* Анимация пульсации для стрелок консенсуса */
        .pulse-arrow {
            stroke-dasharray: 8, 4;
            animation: dash 30s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }
    </style>
</head>
<body>

    <!-- Космический фон -->
    <div class="space-bg">
        <div class="nebula"></div>
        <canvas id="starsCanvas"></canvas>
    </div>

    <!-- Основной контент со схемой -->
    <div class="content-container">
        <div class="t22-flow">
            <svg viewBox="0 0 680 616" width="100%" height="auto" role="img" aria-labelledby="t22-title t22-desc">
                <title id="t22-title">Technical path from Token-2022 to Korea's STO law</title>
                <desc id="t22-desc">Flowchart: Token-2022 by Solana Labs, to WNS, to the WEN token launch, to institutional adoption, to Shinhan Asset Management's proof of concept with a parallel Plume proof of concept, to Korea's expected STO law in February 2027.</desc>
                
                <defs>
                    <!-- Маркеры стрелок со светящимся оттенком -->
                    <marker id="t22-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M2 1L8 5L2 9" fill="none" stroke="#7e8c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </marker>

                    <!-- Неоновые градиенты для блоков, адаптированные под темную тему -->
                    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#072b22"/>
                        <stop offset="100%" stop-color="#0f4d3c"/>
                    </linearGradient>
                    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0a2540"/>
                        <stop offset="100%" stop-color="#144372"/>
                    </linearGradient>
                    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3d1d13"/>
                        <stop offset="100%" stop-color="#612816"/>
                    </linearGradient>
                    <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1c1d22"/>
                        <stop offset="100%" stop-color="#2d2f38"/>
                    </linearGradient>
                </defs>

                <!-- Шаг 1: Token-2022 -->
                <rect x="190" y="20" width="280" height="56" rx="8" fill="url(#grad-green)" stroke="#17a27e" stroke-width="1"/>
                <text x="330" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#e6fcf6">Token-2022 (Solana Labs)</text>
                <text x="330" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8ce0cb">5 independent security audits</text>
                <line x1="330" y1="76" x2="330" y2="116" stroke="#52627a" stroke-width="1.5" class="pulse-arrow" marker-end="url(#t22-arrow)"/>

                <!-- Шаг 2: WNS -->
                <rect x="190" y="116" width="280" height="56" rx="8" fill="url(#grad-green)" stroke="#17a27e" stroke-width="1"/>
                <text x="330" y="136" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#e6fcf6">WNS — Wen New Standard</text>
                <text x="330" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8ce0cb">Group/Member PDAs, royalties</text>
                <line x1="330" y1="172" x2="330" y2="212" stroke="#52627a" stroke-width="1.5" class="pulse-arrow" marker-end="url(#t22-arrow)"/>

                <!-- Шаг 3: $WEN -->
                <rect x="190" y="212" width="280" height="56" rx="8" fill="url(#grad-blue)" stroke="#2b82d9" stroke-width="1"/>
                <text x="330" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ecf5fc">$WEN — January 2024</text>
                <text x="330" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9ecbf7">1M+ wallets, real-world stress test</text>
                <line x1="330" y1="268" x2="330" y2="308" stroke="#52627a" stroke-width="1.5" class="pulse-arrow" marker-end="url(#t22-arrow)"/>

                <!-- Шаг 4: Institutional adoption -->
                <rect x="190" y="308" width="280" height="56" rx="8" fill="url(#grad-blue)" stroke="#2b82d9" stroke-width="1"/>
                <text x="330" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ecf5fc">Institutional adoption</text>
                <text x="330" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9ecbf7">PYUSD, USDG, EURC stablecoins</text>
                <line x1="330" y1="364" x2="330" y2="404" stroke="#52627a" stroke-width="1.5" class="pulse-arrow" marker-end="url(#t22-arrow)"/>

                <!-- Шаг 5: Shinhan PoC -->
                <rect x="190" y="404" width="280" height="56" rx="8" fill="url(#grad-orange)" stroke="#df5e35" stroke-width="1"/>
                <text x="330" y="424" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fdf0ec">Shinhan Asset Mgmt PoC</text>
                <text x="330" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f4a78e">KYC/AML, issuance — Aug 2026</text>

                <!-- Параллельный шаг: Plume PoC -->
                <rect x="500" y="404" width="140" height="56" rx="8" fill="url(#grad-gray)" stroke="#7e8c9a" stroke-width="1"/>
                <text x="570" y="424" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f0f2f5">Plume PoC</text>
                <text x="570" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b0bac5">Aug 14 2026, parallel</text>
                <path d="M500 432 L410 470" fill="none" stroke="#6b7c96" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#t22-arrow)"/>
                <line x1="330" y1="460" x2="330" y2="500" stroke="#52627a" stroke-width="1.5" class="pulse-arrow" marker-end="url(#t22-arrow)"/>

                <!-- Шаг 6: Korea STO law -->
                <rect x="190" y="500" width="280" height="56" rx="8" fill="url(#grad-orange)" stroke="#df5e35" stroke-width="1"/>
                <text x="330" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fdf0ec">Korea's STO law</text>
                <text x="330" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f4a78e">Expected effective Feb 2027</text>
            </svg>
        </div>
    </div>
